<title>注音小學堂</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Sans+TC:wght@500;700;900&display=swap">
<style>
/* Layout: one centered phone-width column. Path map + symbol chart as tabs; lessons open as a full-screen layer. */
:root{
  --bg:#EEF6FF; --surface:#FFFFFF; --ink:#1D2B4F; --muted:#64739A; --line:#D3E1F4;
  --sky:#2F7BF5; --sky-d:#1C5BC7; --leaf:#22B46B; --leaf-d:#168A50;
  --sun:#FFC23A; --sun-d:#D99A0B; --coral:#FF5F5F; --coral-d:#D43D3D;
  --grape:#8A68EE; --grape-d:#6646CC; --lock:#CBD7E8; --lock-d:#A8B7CD;
  --guide:#D9E6F7; --ink-stroke:#1D2B4F; --cat:#FF9A3C; --cat-d:#DE7414; --cat-belly:#FFE3C2;
  --ok-bg:#DDF7E8; --no-bg:#FFE3E3; --on-color:#FFFFFF;
  --f-ui:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-zy:"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1830; --surface:#18264A; --ink:#EAF1FF; --muted:#9DADCF; --line:#2B3C68;
  --sky:#5A9BFF; --sky-d:#336FD0; --leaf:#38CC82; --leaf-d:#1F9659; --sun:#FFD15A; --sun-d:#C9970F;
  --coral:#FF7676; --coral-d:#C94646; --grape:#A287FF; --grape-d:#7558D8; --lock:#34456F; --lock-d:#243358;
  --guide:#2C3D69; --ink-stroke:#FFE7A8; --cat-belly:#FFE3C2; --ok-bg:#163D2C; --no-bg:#4A1F27; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1830; --surface:#18264A; --ink:#EAF1FF; --muted:#9DADCF; --line:#2B3C68;
  --sky:#5A9BFF; --sky-d:#336FD0; --leaf:#38CC82; --leaf-d:#1F9659; --sun:#FFD15A; --sun-d:#C9970F;
  --coral:#FF7676; --coral-d:#C94646; --grape:#A287FF; --grape-d:#7558D8; --lock:#34456F; --lock-d:#243358;
  --guide:#2C3D69; --ink-stroke:#FFE7A8; --cat-belly:#FFE3C2; --ok-bg:#163D2C; --no-bg:#4A1F27; color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.zy{font-family:var(--f-zy)}

/* ---------- shell ---------- */
.shell{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:12px;padding-block:12px;border-bottom:2px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:1.25rem;letter-spacing:.04em;margin-right:auto}
.brand svg{width:38px;height:38px}
.pill{display:flex;align-items:center;gap:6px;font-weight:900;padding:6px 12px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-variant-numeric:tabular-nums}
.pill .st{color:var(--sun-d)}
.iconbtn{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line)}
.iconbtn svg{width:22px;height:22px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
main{flex:1;padding-block:8px 110px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:2px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tabs .in{max-width:560px;margin:0 auto;display:flex;gap:10px;padding-block:8px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:10px;border-radius:16px;font-weight:700;color:var(--muted);border:2px solid transparent}
.tab[aria-selected="true"]{color:var(--sky);background:color-mix(in srgb,var(--sky) 12%,transparent);border-color:color-mix(in srgb,var(--sky) 40%,transparent)}
.tab .g{font-family:var(--f-zy);font-size:1.35rem;line-height:1}

/* ---------- path ---------- */
.unit{margin-top:18px}
.unit-head{border-radius:20px;padding:14px 18px;color:var(--on-color);background:var(--c);box-shadow:0 5px 0 var(--cd);display:flex;align-items:center;gap:12px}
.unit-head .t{min-width:0}
.unit-head small{display:block;font-weight:700;opacity:.9;font-size:.85rem;letter-spacing:.06em}
.unit-head b{display:block;font-size:1.3rem;font-weight:900}
.unit-head .big{margin-left:auto;font-family:var(--f-zy);font-size:2rem;letter-spacing:.08em;white-space:nowrap;font-weight:700}
.nodes{display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:24px 8px;position:relative}
.node-wrap{position:relative;transform:translateX(calc(var(--x) * 1px));display:flex;align-items:center}
.node{width:76px;height:70px;border-radius:50%;background:var(--c);box-shadow:0 7px 0 var(--cd);color:var(--on-color);display:grid;place-items:center;
  font-family:var(--f-zy);font-size:2.3rem;font-weight:700;position:relative;transition:transform .1s}
.node:active{transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node.lock{background:var(--lock);box-shadow:0 7px 0 var(--lock-d);color:var(--muted);cursor:not-allowed}
.node.review{font-family:var(--f-ui);font-size:1.5rem}
.node svg{width:32px;height:32px}
.node.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--c);opacity:.5;animation:ring 1.6s ease-out infinite}
@keyframes ring{from{transform:scale(.9);opacity:.7}to{transform:scale(1.25);opacity:0}}
.stars{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);display:flex;gap:1px;font-size:.85rem;white-space:nowrap}
.stars i{font-style:normal;color:var(--lock-d)}
.stars i.on{color:var(--sun-d)}
.start-tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:var(--c);
  font-weight:900;padding:6px 12px;border-radius:12px;white-space:nowrap;animation:bob 1.2s ease-in-out infinite;font-size:.95rem}
.start-tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.side-cat{position:absolute;width:74px;height:74px;top:-2px}
.side-cat.r{left:calc(100% + 18px)} .side-cat.l{right:calc(100% + 18px)}
.hello{display:flex;gap:12px;align-items:center;background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:12px 14px;margin-top:14px}
.hello svg{width:62px;height:62px;flex:none}
.hello p{margin:0;font-weight:700;line-height:1.5}
.hello p .sub{color:var(--muted);font-weight:500;font-size:.9rem;display:block}

/* ---------- chart ---------- */
.chart h2{font-size:1.05rem;margin:22px 0 10px;display:flex;align-items:baseline;gap:8px}
.chart h2 small{color:var(--muted);font-weight:500;font-size:.85rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:10px}
.tile{background:var(--surface);border:2px solid var(--line);border-bottom-width:5px;border-radius:18px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tile:active{transform:translateY(3px);border-bottom-width:2px;margin-top:3px}
.tile .s{font-family:var(--f-zy);font-size:2.4rem;line-height:1.1;font-weight:700}
.tile .e{font-size:1.2rem;line-height:1}
.tile.done{border-color:color-mix(in srgb,var(--leaf) 55%,var(--line))}
.tile.done .s{color:var(--leaf-d)}
.note{color:var(--muted);font-size:.85rem;line-height:1.6;margin-top:18px}

/* ---------- overlays ---------- */
.layer{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.layer .col{width:100%;max-width:560px;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbar{display:flex;align-items:center;gap:14px;padding-block:14px}
.prog{flex:1;height:18px;border-radius:999px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--leaf);border-radius:999px;transition:width .4s ease;box-shadow:inset 0 -5px 0 rgba(0,0,0,.08)}
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-block:8px 18px;min-height:0;overflow-y:auto;text-align:center}
.prompt{font-size:1.35rem;font-weight:900;display:flex;align-items:center;gap:10px;text-wrap:balance;justify-content:center}
.prompt svg{width:52px;height:52px;flex:none}
.speak{width:110px;height:110px;border-radius:32px;background:var(--sky);box-shadow:0 7px 0 var(--sky-d);display:grid;place-items:center}
.speak svg{width:58px;height:58px;fill:var(--on-color)}
.speak.sm{width:64px;height:64px;border-radius:20px;box-shadow:0 5px 0 var(--sky-d)}
.speak.sm svg{width:34px;height:34px}
.speak:active{transform:translateY(5px);box-shadow:0 2px 0 var(--sky-d)}
.speak.playing{animation:pulse .5s ease-in-out 2}
@keyframes pulse{50%{transform:scale(1.07)}}

.bigcard{background:var(--surface);border:3px solid var(--line);border-bottom-width:8px;border-radius:32px;width:min(260px,72vw);aspect-ratio:1;display:grid;place-items:center;position:relative;max-width:100%}
.bigcard .s{font-family:var(--f-zy);font-size:min(170px,46vw);line-height:1;font-weight:700;color:var(--sky)}
.bigcard .speak{position:absolute;right:-14px;bottom:-14px}
.example{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:10px 18px}
.example .em{font-size:3rem;line-height:1}

/* word with vertical zhuyin (Taiwan textbook style) */
.wd{display:inline-flex;gap:6px;align-items:center}
.wz{display:inline-flex;align-items:center;gap:2px}
.wz .ch{font-family:var(--f-zy);font-size:2.6rem;line-height:1;font-weight:700}
.zc{display:inline-flex;align-items:center;position:relative;font-family:var(--f-zy);font-size:.95rem;line-height:1.05}
.zc .ls{display:flex;flex-direction:column;align-items:center}
.zc .tn{font-size:.9em;margin-left:1px}
.zc .dot{position:absolute;top:-.75em;left:0;right:0;text-align:center}
.zc .hl{color:var(--coral);font-weight:700}
.blank{display:inline-block;width:1.15em;height:1.15em;border:2px dashed var(--coral);border-radius:5px;margin:1px 0;font-size:.8em;line-height:1.05em;color:var(--coral);font-family:var(--f-ui);font-weight:900}

.opts{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.opt{width:96px;height:104px;border-radius:24px;background:var(--surface);border:3px solid var(--line);border-bottom-width:7px;font-family:var(--f-zy);font-size:3.4rem;font-weight:700;line-height:1;display:grid;place-items:center;transition:transform .08s}
.opt:active{transform:translateY(3px)}
.opt.wide{width:auto;min-width:96px;padding:0 16px;font-size:2.4rem}
.opt.ok{background:var(--ok-bg);border-color:var(--leaf);color:var(--leaf-d)}
.opt.no{background:var(--no-bg);border-color:var(--coral);color:var(--coral-d);animation:shake .35s}
.opt.dim{opacity:.35}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.opt .lab{display:block;font-family:var(--f-ui);font-size:.75rem;color:var(--muted);font-weight:700;margin-top:4px}

.trace{position:relative;width:min(300px,78vw);aspect-ratio:1;max-width:100%;background:var(--surface);border:3px solid var(--line);border-bottom-width:7px;border-radius:28px;touch-action:none;overflow:hidden}
.trace canvas{position:absolute;inset:0;width:100%;height:100%}
.trace .cross{position:absolute;inset:0;background:
  linear-gradient(var(--line),var(--line)) center/100% 2px no-repeat,
  linear-gradient(var(--line),var(--line)) center/2px 100% no-repeat;opacity:.6}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.btn{min-width:130px;padding:14px 22px;border-radius:18px;font-weight:900;font-size:1.1rem;color:var(--on-color);background:var(--c,var(--sky));box-shadow:0 5px 0 var(--cd,var(--sky-d));letter-spacing:.05em}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--cd,var(--sky-d))}
.btn.ghost{background:var(--surface);color:var(--muted);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.go{--c:var(--leaf);--cd:var(--leaf-d)}
.btn.wide{width:100%}
.hint{color:var(--muted);font-weight:700;min-height:1.4em}

.pond{position:relative;width:100%;height:min(360px,48vh);min-height:260px;border-radius:28px;background:
  radial-gradient(circle at 20% 15%,color-mix(in srgb,var(--sky) 14%,transparent),transparent 45%),
  radial-gradient(circle at 80% 85%,color-mix(in srgb,var(--leaf) 14%,transparent),transparent 45%),var(--surface);border:3px solid var(--line);overflow:hidden}
.bub{position:absolute;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-zy);font-size:2.4rem;font-weight:700;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,transparent 10%),color-mix(in srgb,var(--sky) 22%,var(--surface));
  border:3px solid color-mix(in srgb,var(--sky) 55%,transparent);animation:float var(--d) ease-in-out infinite alternate}
@keyframes float{from{transform:translate(0,0)}to{transform:translate(var(--dx),var(--dy))}}
.bub.pop{animation:pop .3s forwards;pointer-events:none}
@keyframes pop{to{transform:scale(1.6);opacity:0}}
.bub.no{animation:shake .35s;border-color:var(--coral)}
.target{display:flex;align-items:center;gap:12px;font-weight:900;font-size:1.2rem}
.target .zy{font-size:2.6rem;color:var(--sky);line-height:1}
.count{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}

.blend{display:flex;align-items:center;gap:10px;font-family:var(--f-zy);font-weight:700}
.blend .p{width:84px;height:92px;border-radius:22px;background:var(--surface);border:3px solid var(--line);border-bottom-width:7px;display:grid;place-items:center;font-size:3rem;transition:transform .5s cubic-bezier(.5,-0.4,.4,1.4)}
.blend .op{font-family:var(--f-ui);font-size:2rem;color:var(--muted);font-weight:900;transition:opacity .3s}
.blend.go .a{transform:translateX(52px)} .blend.go .b{transform:translateX(-52px)} .blend.go .op{opacity:0}
.res{display:flex;align-items:center;gap:14px;opacity:0;transform:scale(.8);transition:.4s .45s}
.res.show{opacity:1;transform:none}
.res .wz .ch{font-size:3.4rem}
.res .zc{font-size:1.25rem}

.tones{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:min(340px,100%)}
.tcard{background:var(--surface);border:3px solid var(--line);border-bottom-width:7px;border-radius:22px;padding:10px;display:flex;align-items:center;justify-content:center;gap:10px}
.tcard .wz .ch{font-size:2.6rem}
.tcard svg{width:44px;height:30px;stroke:var(--grape);fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tcard small{display:block;color:var(--muted);font-weight:700;font-size:.8rem}

/* feedback bar */
.fb{transform:translateY(110%);transition:transform .25s ease;background:var(--ok-bg);border-top:3px solid var(--leaf);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.fb.show{transform:none}
.fb .in{max-width:560px;margin:0 auto;padding-block:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.fb .msg{flex:1;min-width:150px;display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.35rem;color:var(--leaf-d)}
.fb .msg svg{width:54px;height:54px;flex:none}
.fb .btn{flex:1 1 160px}

/* result */
.result{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-block:20px}
.result svg.big{width:150px;height:150px}
.result h2{font-size:1.8rem;margin:0;font-weight:900}
.result p{margin:0;color:var(--muted);font-weight:700}
.bigstars{display:flex;gap:10px;font-size:3.4rem;line-height:1}
.bigstars i{font-style:normal;color:var(--lock);transform:scale(0);animation:starIn .45s forwards}
.bigstars i.on{color:var(--sun)}
@keyframes starIn{60%{transform:scale(1.3)}to{transform:scale(1)}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}

/* settings sheet */
.sheet{position:fixed;inset:0;z-index:30;background:rgba(10,20,40,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--surface);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px max(20px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet h3{margin:0;font-size:1.2rem}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:2px solid var(--line);font-weight:700}
.set span small{display:block;color:var(--muted);font-weight:500;font-size:.82rem}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;flex:none}
.seg button{padding:8px 12px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--sky);color:var(--on-color)}
.sw{width:56px;height:32px;border-radius:999px;background:var(--lock);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:var(--surface);transition:left .2s}
.sw[aria-checked="true"]{background:var(--leaf)} .sw[aria-checked="true"]::after{left:28px}
.warn{background:color-mix(in srgb,var(--sun) 22%,var(--surface));border:2px solid var(--sun);border-radius:14px;padding:10px 12px;font-size:.88rem;line-height:1.5;margin-top:12px}

.cat-bounce{animation:catb .6s ease}
@keyframes catb{30%{transform:translateY(-10px) rotate(-6deg)}60%{transform:translateY(0) rotate(4deg)}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>

<div class="shell" id="shell">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true" class="cat-mini"></svg>注音小學堂</div>
    <div class="pill" title="得到的星星"><span class="st">★</span><span id="starCount">0</span></div>
    <button class="iconbtn" id="setBtn" aria-label="家長設定"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </header>
  <main id="main"></main>

/* ======================= AUDIO ======================= */
let voice=null, hasZh=true;
function pickVoice(){
  if(!('speechSynthesis' in window)){hasZh=false;return}
  const vs=speechSynthesis.getVoices(); if(!vs.length) return;
  voice = vs.find(v=>/zh[-_]TW/i.test(v.lang)) || vs.find(v=>/zh[-_]HK/i.test(v.lang)&&/Mandarin|國語/i.test(v.name)) || vs.find(v=>/^zh/i.test(v.lang)) || null;
  hasZh=!!voice;
}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,{rate}={}){
  return new Promise(res=>{
    if(!('speechSynthesis' in window)) return res();
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text);
      u.lang=voice?voice.lang:'zh-TW'; if(voice)u.voice=voice;
      u.rate=rate||S.rate; u.pitch=1.1;
      let done=false;const fin=()=>{if(!done){done=true;res()}};
      u.onend=fin;u.onerror=fin;setTimeout(fin,2500+text.length*500);
      speechSynthesis.speak(u);
    }catch(e){res()}
  });
}
const saySym=s=>speak(SYM[s].say,{rate:Math.min(S.rate,.75)});
let AC=null;
function tone(seq){
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
    let t=AC.currentTime;
    seq.forEach(([f,d,type='sine',vol=.18])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
      g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.7});
  }catch(e){}
}

/* ======================= LESSON ENGINE ======================= */
let LS=null; // {lesson, steps, i, mistakes, layer}
function distractors(target,n,poolHint){
  const L=[...learned()].filter(s=>s!==target);
  let pool=shuffle([...new Set([...(poolHint||[]).filter(s=>s!==target),...L])]);
  if(pool.length<n) pool=pool.concat(shuffle(ORDER.filter(s=>s!==target&&!pool.includes(s))));
  return pool.slice(0,n);
}
function buildSteps(L){
  const u=UNITS[L.ui];
  if(L.type==='sym'){const s=L.s, peers=[...u.sy];
    return [{t:'intro',s},{t:'listen',s,peers},{t:'trace',s},{t:'picture',s,peers},{t:'listen',s,peers},{t:'trace',s}];}
  if(L.type==='review'){const sy=[...u.sy];const a=shuffle(sy);
    return [{t:'bubbles',s:a[0],peers:sy},{t:'picture',s:a[1],peers:sy},{t:'listen',s:a[2],peers:sy},{t:'picture',s:a[0],peers:sy},{t:'bubbles',s:a[1],peers:sy},{t:'listen',s:a[3%a.length],peers:sy},{t:'trace',s:pick(sy)}];}
  if(L.type==='blend'){const set=shuffle(L.set);
    return [{t:'blendDemo',it:set[0]},{t:'blendDemo',it:set[1]},{t:'blendPick',it:set[2],set},{t:'blendBuild',it:set[3],set},{t:'blendPick',it:set[4],set},{t:'blendBuild',it:set[5],set}];}
  if(L.type==='tone'){const set=L.set;
    return [{t:'toneDemo',set},...shuffle([0,1,2,3]).map(k=>({t:'tonePick',set,k}))];}
}
function startLesson(id){
  const L=LESSONS[id];
  const layer=h(`<div class="layer" role="dialog" aria-label="課程"><div class="col">
     <div class="lbar"><button class="iconbtn" id="xBtn" aria-label="離開課程"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><div class="prog"><i></i></div></div>
     <div class="stage" id="stage"></div></div>
     <div class="fb" id="fb"><div class="in"><div class="msg">${catSVG('happy')}<span id="fbTxt"></span></div><button class="btn go" id="fbGo">繼續</button></div></div></div>`);
  document.body.appendChild(layer);
  document.body.style.overflow='hidden';
  LS={L,steps:buildSteps(L),i:0,mistakes:0,layer};
  layer.querySelector('#xBtn').onclick=quitLesson;
  layer.querySelector('#fbGo').onclick=next;
  showStep();
}
function quitLesson(){speechSynthesis?.cancel?.();LS.layer.remove();LS=null;document.body.style.overflow='';render()}
function setProg(){LS.layer.querySelector('.prog i').style.width=(LS.i/LS.steps.length*100)+'%'}
function showStep(){
  setProg();
  const st=LS.steps[LS.i], stage=LS.layer.querySelector('#stage');
  stage.innerHTML=''; stage.scrollTop=0;
  LS.layer.querySelector('#fb').classList.remove('show');
  STEPS[st.t](stage,st);
}
async function correct(text){
  sfx.ok();
  const p=text||pick(PRAISE);
  LS.layer.querySelector('#fbTxt').textContent=p;
  LS.layer.querySelector('#fb').classList.add('show');
  LS.layer.querySelector('#fbGo').focus({preventScroll:true});
  await wait(350); speak(p.replace('！',''),{rate:1});
}
function wrong(){LS.mistakes++;sfx.no()}
function next(){
  LS.i++;
  if(LS.i>=LS.steps.length) return finish();
  showStep();
}
function finish(){
  setProg();
  const stars=LS.mistakes===0?3:LS.mistakes<=2?2:1;
  const id=LS.L.id;
  P.stars[id]=Math.max(P.stars[id]||0,stars); save();
  const col=LS.layer.querySelector('.col');
  LS.layer.querySelector('#fb').classList.remove('show');
  col.querySelector('.stage').outerHTML=`<div class="result">${catSVG('happy').replace('<svg','<svg class="big cat-bounce"')}
     <h2>${stars===3?'完美過關！':stars===2?'做得很好！':'完成了！'}</h2>
     <div class="bigstars">${[1,2,3].map(i=>`<i class="${i<=stars?'on':''}" style="animation-delay:${.2+i*.25}s">★</i>`).join('')}</div>
     <p>${LS.L.type==='sym'?`你學會了 <span class="zy" style="font-size:1.5em;color:var(--sky)">${LS.L.s}</span>`:'又往前走了一站'}</p>
     <button class="btn go" id="doneBtn" style="margin-top:10px">回到地圖</button></div>`;
  col.querySelector('#doneBtn').onclick=quitLesson;
  sfx.win(); confetti();
  setTimeout(()=>speak(stars===3?'完美過關':'做得很好',{rate:1}),400);
}

function speakerBtn(fn,sm){const b=h(`<button class="speak ${sm?'sm':''}" aria-label="再聽一次">${SPK}</button>`);
  b.onclick=()=>{b.classList.remove('playing');void b.offsetWidth;b.classList.add('playing');fn()};return b}
function prompt(text,mood='think'){return h(`<div class="prompt">${catSVG(mood)}<span>${text}</span></div>`)}
function optionRow(items,target,onRight,{wide=false,label=null,render=null}={}){
  const row=h(`<div class="opts"></div>`);let done=false;
  shuffle(items).forEach(it=>{
    const b=h(`<button class="opt ${wide?'wide':''}"></button>`);
    b.innerHTML=render?render(it):it;
    b.onclick=()=>{if(done)return;
      if(it===target){done=true;b.classList.add('ok');row.querySelectorAll('.opt').forEach(o=>{if(o!==b)o.classList.add('dim')});onRight&&onRight()}
      else{b.classList.remove('no');void b.offsetWidth;b.classList.add('no');wrong();label&&label()}};
    row.appendChild(b)});
  return row;
}

 trace(stage,{s}){
  stage.append(prompt(`沿著灰色的線，寫寫看「${s}」`,'happy'));
  const box=h(`<div class="trace"><div class="cross"></div><canvas class="g"></canvas><canvas class="u"></canvas></div>`);
  stage.append(box);
  const hint=h(`<p class="hint"></p>`);stage.append(hint);
  const row=h(`<div class="row"></div>`);
  const clr=h(`<button class="btn ghost">擦掉</button>`), ok=h(`<button class="btn">寫好了</button>`);
  row.append(speakerBtn(()=>saySym(s),true),clr,ok);stage.append(row);
  const g=box.querySelector('.g'), u=box.querySelector('.u'), gc=g.getContext('2d'), uc=u.getContext('2d');
  let W=0, strokes=[], cur=null, passed=false;
  const dpr=Math.max(1,window.devicePixelRatio||1);
  async function setup(){
    W=box.clientWidth; [g,u].forEach(c=>{c.width=c.height=W*dpr});
    gc.setTransform(dpr,0,0,dpr,0,0);uc.setTransform(dpr,0,0,dpr,0,0);
    try{await Promise.race([document.fonts.load(`700 80px "LXGW WenKai TC"`,s),wait(1500)])}catch(e){}
    gc.clearRect(0,0,W,W); drawGlyph(gc,s,W,cssv('--guide'),W*.035); drawGlyph(gc,s,W,cssv('--guide'));
    redraw();
  }
  const lw=()=>W*.085;
  function redraw(){uc.clearRect(0,0,W,W);uc.lineCap='round';uc.lineJoin='round';uc.lineWidth=lw();uc.strokeStyle=passed?cssv('--leaf'):cssv('--ink-stroke');
    strokes.forEach(st=>{uc.beginPath();st.forEach((p,i)=>i?uc.lineTo(p.x,p.y):uc.moveTo(p.x,p.y));if(st.length===1)uc.lineTo(st[0].x+.1,st[0].y);uc.stroke()})}
  const pt=e=>{const r=u.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*W/r.height}};
  u.addEventListener('pointerdown',e=>{if(passed)return;u.setPointerCapture(e.pointerId);cur=[pt(e)];strokes.push(cur);redraw()});
  u.addEventListener('pointermove',e=>{if(!cur)return;cur.push(pt(e));redraw()});
  const end=()=>{cur=null};u.addEventListener('pointerup',end);u.addEventListener('pointercancel',end);
  clr.onclick=()=>{if(passed)return;strokes=[];redraw();hint.textContent=''};
  ok.onclick=()=>{if(passed)return;
    if(!strokes.length){hint.textContent='先用手指沿著灰色的線畫畫看';return}
    const {cov,prec}=traceScore(s,strokes,W,lw());
    if(cov>=.6&&prec>=.6){passed=true;redraw();hint.textContent='';correct(cov>.8?'寫得好漂亮！':'寫得很好！')}
    else{wrong();hint.textContent=cov<.6?'還有一些地方沒有寫到，再試一次！':'要沿著灰色的線寫喔，再試一次！';setTimeout(()=>{strokes=[];redraw()},700)}
  };
  requestAnimationFrame(setup);
 },
 bubbles(stage,{s,peers}){

/* ---------- tracing ---------- */
const ZYFONT='"LXGW WenKai TC","BiauKai","DFKai-SB","Kaiti TC","STKaiti",serif';
function drawGlyph(c,sym,N,color,strokeW){
  c.save();c.font=`700 ${N*.7}px ${ZYFONT}`;c.textAlign='left';c.textBaseline='alphabetic';
  const m=c.measureText(sym);
  const w=m.actualBoundingBoxLeft+m.actualBoundingBoxRight, hh=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
  const x=(N-w)/2+m.actualBoundingBoxLeft, y=(N-hh)/2+m.actualBoundingBoxAscent;
  if(strokeW){c.lineWidth=strokeW;c.strokeStyle=color;c.lineJoin='round';c.strokeText(sym,x,y)}
  else{c.fillStyle=color;c.fillText(sym,x,y)}
  c.restore();
}
function traceScore(sym,strokes,W,lw){
  const N=120,k=N/W,cv=document.createElement('canvas');cv.width=cv.height=N;const c=cv.getContext('2d',{willReadFrequently:true});
  drawGlyph(c,sym,N,'#000');const T=c.getImageData(0,0,N,N).data;
  c.clearRect(0,0,N,N);drawGlyph(c,sym,N,'#000');drawGlyph(c,sym,N,'#000',N*.13);const D=c.getImageData(0,0,N,N).data;
  c.clearRect(0,0,N,N);c.lineCap='round';c.lineJoin='round';c.lineWidth=lw*k*1.15;c.strokeStyle='#000';
  strokes.forEach(st=>{c.beginPath();st.forEach((p,i)=>i?c.lineTo(p.x*k,p.y*k):c.moveTo(p.x*k,p.y*k));if(st.length===1)c.lineTo(st[0].x*k+.1,st[0].y*k);c.stroke()});
  const U=c.getImageData(0,0,N,N).data;
  let t=0,tu=0,u=0,ud=0;
  for(let i=3;i<T.length;i+=4){const ti=T[i]>110,ui=U[i]>110;if(ti){t++;if(ui)tu++}if(ui){u++;if(D[i]>60)ud++}}
  return{cov:t?tu/t:0,prec:u?ud/u:0};
}

/* ---------- confetti ---------- */
function confetti(){
  const cv=$('#confetti');if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  cv.hidden=false;const c=cv.getContext('2d');cv.width=innerWidth;cv.height=innerHeight;
  const cols=['--sky','--leaf','--sun','--coral','--grape','--cat'].map(cssv);
  const ps=Array.from({length:140},()=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+4,c:pick(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function tick(){c.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;c.save();c.translate(p.x,p.y);c.rotate(p.a);c.fillStyle=p.c;c.fillRect(-p.r/2,-p.r/4,p.r,p.r/2);c.restore()});
    if(++f<150)requestAnimationFrame(tick);else{c.clearRect(0,0,cv.width,cv.height);cv.hidden=true}})();
}
